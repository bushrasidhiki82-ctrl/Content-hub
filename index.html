<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CreatorHub — Content Creator Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#f2f4f9;--card:#fff;--tx:#151829;--mut:#6a7090;--bd:#e5e8f2;--ac:#5b4bff;--ac2:#00c2a8;--sh:0 1px 2px rgba(21,24,41,.04),0 10px 28px rgba(21,24,41,.06);--r:18px;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
[data-theme=dark]{--bg:#0c0e19;--card:#151829;--tx:#eceefb;--mut:#8d92b6;--bd:#242842;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:244px;flex:none;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:18px}
.brand i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2))}
nav#nav{display:flex;flex-direction:column;gap:3px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:600;text-align:left;transition:.18s}
.nv:hover{background:var(--bg);color:var(--tx);transform:translateX(2px)}
.nv.on{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac)}
.free{margin-top:auto;padding:12px;border-radius:12px;background:var(--bg);color:var(--mut);font-size:12.5px}
.main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:0 14px;color:var(--mut)}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:0}
#view{padding:10px 28px 40px;max-width:1280px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:14px 0 20px}
h1{font-size:26px;letter-spacing:-.02em;font-weight:800}
h3{font-size:16px;font-weight:700}
.mut{color:var(--mut)}.sm{font-size:12.5px}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}
.btn{background:linear-gradient(135deg,var(--ac),#7a5cff);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 35%,transparent);transition:.18s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.ico{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:10px;color:var(--mut);transition:.15s}
.ico:hover{background:var(--bg);color:var(--tx)}
.ico.big{width:42px;height:42px;background:var(--card);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--sh);transition:.2s}
.card:hover{transform:translateY(-2px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat b{display:block;font-size:30px;letter-spacing:-.03em;font-weight:800}
.stat span{color:var(--mut);font-size:13px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card h3{margin-bottom:12px}.cards .card h3,.proj h3{margin-bottom:0}
.bar{height:8px;border-radius:9px;background:var(--bg);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.bar.thin{height:6px;margin:6px 0 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--bd);color:var(--mut)}
[class*=" s-"].pill,.pill[class*="s-"]{color:var(--s);background:color-mix(in srgb,var(--s) 13%,transparent);border-color:transparent}
.pr-High{color:#e5484d}.pr-Medium{color:#d98a00}
.s-idea,.s-draft{--s:#8d92b6}.s-planned{--s:#5b4bff}.s-inprogress{--s:#f59e0b}.s-created,.s-recorded{--s:#3b82f6}.s-completed,.s-published,.s-ready{--s:#10b981}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--bd);display:grid;place-items:center;flex:none;color:#fff;transition:.15s}
.chk:hover{border-color:var(--ac)}
.done .chk{background:var(--ac2);border-color:var(--ac2)}
.done b,.done>span{text-decoration:line-through;opacity:.55}
.tasks{list-style:none;padding:0;display:grid;gap:8px;margin-bottom:12px}
.tasks li,.list-row{display:flex;align-items:center;gap:10px}
.tasks li span{flex:1}
.idea{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--sh);transition:.2s}
.idea:hover{transform:translateY(-2px)}.idea .chk{margin-top:2px}
.idea p{font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select,.mini,.fld input,.fld select,.fld textarea,.capform input,.capform select{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
.filters input{flex:1;min-width:200px;width:auto}.filters select{width:auto}
.mini{width:auto;padding:6px 8px;font-size:12.5px}
.empty{text-align:center;padding:40px;color:var(--mut);border:1px dashed var(--bd);border-radius:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-weight:700;color:var(--mut);font-size:12.5px;padding:6px 0}
.cell{min-height:112px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.15s;min-width:0}
.cell:hover{border-color:var(--ac)}.cell.off{background:transparent;border-color:transparent;cursor:default}
.cell.today{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 25%,transparent)}
.dn{font-weight:700;font-size:12.5px;color:var(--mut)}.today .dn{color:var(--ac)}
.ev{display:block;text-align:left;padding:4px 7px;border-radius:8px;border-left:3px solid var(--s);background:color-mix(in srgb,var(--s) 13%,var(--card));overflow:hidden}
.ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:6px}
.chart{width:100%;height:auto}.chart .grid{stroke:var(--bd)}.chart .axis{fill:var(--mut);font-size:11px;text-anchor:middle}
.b-Planned{fill:#bdb6ff}.b-Created{fill:#3b82f6}.b-Published{fill:#10b981}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;font-size:13px}
.lbl{font-size:12.5px;font-weight:700;color:var(--mut);margin-top:10px}
.capgrid{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
.capform{display:grid;gap:12px}.capform label,.fld{display:grid;gap:5px;font-weight:600;font-size:13px}
.out{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:16px;min-height:150px;margin:12px 0}
.banner{background:color-mix(in srgb,#f59e0b 14%,transparent);color:#b36b00;border-radius:12px;padding:10px 14px;font-weight:600;font-size:13px;margin-bottom:16px}
[data-theme=dark] .banner{color:#fbbf24}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;color:var(--mut)}.seg .on{background:var(--ac);color:#fff}
.res{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
.res:hover{border-color:var(--ac)}.grp{margin:18px 0 8px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,10,20,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:22px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .2s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.wide{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabbar{display:none}
@media(max-width:900px){
 .side{display:none}
 .tabbar{display:flex;position:fixed;z-index:10;left:0;right:0;bottom:0;overflow-x:auto;gap:2px;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .tabbar .nv{flex:0 0 auto;flex-direction:column;gap:2px;padding:6px 12px;font-size:10.5px;align-items:center}
 .top{padding:12px 16px}#view{padding:6px 16px 100px}.hm{display:none}
 .cols,.capgrid{grid-template-columns:1fr}
 .cell{min-height:74px;padding:5px}.ev i{display:none}.ev b{font-size:10.5px}
 .grid2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i>C</i><b>CreatorHub</b></div>
    <nav id="nav"></nav>
    <p class="free">Free to use · no login needed</p>
  </aside>
  <div class="main">
    <header class="top">
      <label class="search"><span id="si"></span><input id="gs" placeholder="Search ideas, projects, scripts, templates…" autocomplete="off"></label>
      <button class="ico big" id="theme" data-act="theme" aria-label="Toggle dark or light mode"></button>
      <button class="btn" data-act="quick">+ <span class="hm">Quick Add</span></button>
    </header>
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast"></div>

    { id: 'c2', title: 'Creator day-in-the-life', platform: 'Instagram', type: 'Reel', status: 'Published', date: day(-5) },

    { id: 'c5', title: 'Festive offer stories', platform: 'Instagram', type: 'Story', status: 'Planned', date: day(1) },
    { id: 'c6', title: 'Trending transformation', platform: 'Instagram', type: 'Reel', status: 'Planned', date: day(2) },

    { id: 'c10', title: 'Behind the scenes Reel', platform: 'Instagram', type: 'Reel', status: 'Planned', date: day(11) }

    { id: 'p2', name: 'Instagram Growth', desc: 'Post 5 Reels a week and grow to 10k followers.', deadline: day(45), total: 20, done: 9 },
    { id: 'p3', name: 'Client Advertisement', desc: 'Festive campaign: stories, reel and carousel.', deadline: day(10), total: 6, done: 4 },

    { id: 'm6', name: 'Trending Reel', hook: '[Trending audio] but make it [your niche].', structure: ['Match the trend opening', 'Niche twist', 'Payoff in last 2 seconds'], cta: 'Follow for more trends.' },

/* Demo analytics: 8 weekly data points per platform. Replace with a real API later. */
CH.analytics = {
  Instagram: { views: [12400, 14100, 13800, 17200, 19800, 18400, 23100, 26500], likes: [980, 1100, 1050, 1420, 1630, 1510, 1980, 2240], comments: [120, 138, 131, 176, 201, 188, 244, 278], shares: [210, 244, 236, 310, 356, 330, 420, 488], followers: [4210, 4390, 4570, 4810, 5090, 5300, 5640, 6020] },
  YouTube: { views: [8200, 9100, 9700, 10400, 12800, 13100, 15600, 17900], likes: [610, 690, 720, 800, 980, 1010, 1220, 1410], comments: [84, 92, 97, 110, 139, 146, 170, 198], shares: [48, 55, 58, 66, 84, 88, 104, 121], followers: [1820, 1910, 2030, 2150, 2330, 2480, 2710, 2960] }

<script>/* ===== Data layer =====
   The ONLY file that touches storage. To move to Firebase/Supabase later,
   replace load() and save() with calls to your cloud database (make them async
   and `await` them in app.js boot). Everything else stays the same. */
window.CH = window.CH || {};
CH.store = {
  key: 'creatorhub:v1',
  load() { try { return JSON.parse(localStorage.getItem(this.key)); } catch (e) { return null; } },
  save(state) { try { localStorage.setItem(this.key, JSON.stringify(state)); } catch (e) { /* storage blocked */ } }
};
</script>
<script>/* ===== CreatorHub app: state, views, actions ===== */
(() => {
const C = CH.config;
let S = CH.store.load() || CH.seed();
S.theme = S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const ui = { view: 'dashboard', gq: '', q: '', fp: '', fs: '', month: new Date(), ap: 'All',
  cap: { topic: '', platform: 'Instagram', tone: 'Friendly', keywords: '', n: 0, out: '' } };
const $ = s => document.querySelector(s);
const save = () => CH.store.save(S);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => iso(new Date());
const fd = s => s ? new Date(s + 'T00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';
const slug = s => 's-' + String(s).toLowerCase().replace(/\s/g, '');
const pill = (t, c = '') => `<span class="pill ${c}">${esc(t)}</span>`;
const opts = (a, v) => a.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('');
const empty = t => `<div class="empty">${t}</div>`;
const head = (t, s, a = '') => `<div class="head"><div><h1>${t}</h1><p class="mut">${s}</p></div><div class="row">${a}</div></div>`;

/* modal + form */
const modal = h => { const m = $('#modal'); m.innerHTML = `<div class="sheet">${h}</div>`; m.hidden = false; };
const close = () => { $('#modal').hidden = true; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 1600); }
async function copy(t) { try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); } toast('Copied to clipboard'); }
function openForm(coll, id, preset) {
  const E = ENT[coll], rec = id ? S[coll].find(x => x.id === id) : { ...E.def(), ...preset };
  const fields = E.f.map(([k, l, t, o]) => `<label class="fld${t === 'textarea' || ['title', 'name', 'text'].includes(k) ? ' wide' : ''}"><span>${l}</span>${t === 'select' ? `<select name="${k}">${opts(o, rec[k])}</select>` : t === 'textarea' ? `<textarea name="${k}" rows="3">${esc(rec[k])}</textarea>` : `<input name="${k}" type="${t}" value="${esc(rec[k])}"${t === 'text' ? ' required' : ''}>`}</label>`).join('');
  modal(`<form id="f"><h3>${id ? 'Edit' : 'New'} ${E.n}</h3><div class="grid2">${fields}</div><div class="row end"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn">Save</button></div></form>`);
  $('#f').onsubmit = e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    E.f.forEach(([k, , t]) => { if (t === 'number') v[k] = Math.max(0, +v[k] || 0); });
    if (coll === 'projects' && v.done > v.total) v.done = v.total;
    id ? Object.assign(rec, v) : S[coll].unshift({ id: uid(), ...rec, ...v });
    save(); close(); render();
  };
}

/* charts */
function stacked(w) {
  const mx = Math.max(1, ...w.map(o => o.Planned + o.Created + o.Published));
  return `<svg viewBox="0 0 500 200" class="chart" role="img" aria-label="Weekly content progress">${[0, 1, 2, 3].map(i => `<line x1="30" x2="490" y1="${20 + i * 45}" y2="${20 + i * 45}" class="grid"/>`).join('')}${w.map((o, i) => { let y = 155; return `<g>${['Published', 'Created', 'Planned'].map(s => { const h = o[s] / mx * 135; y -= h; return h ? `<rect class="b-${s}" x="${55 + i * 88}" y="${y}" width="48" height="${h}" rx="6"/>` : ''; }).join('')}<text x="${79 + i * 88}" y="178" class="axis">Week ${i + 1}</text></g>`; }).join('')}</svg>`;
}
function line(a, id, col) {
  const mx = Math.max(...a), mn = Math.min(...a) * .9, X = i => 30 + i * (440 / (a.length - 1)), Y = v => 160 - (v - mn) / ((mx - mn) || 1) * 130;
  const pts = a.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
  return `<svg viewBox="0 0 500 190" class="chart"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="${X(0)},160 ${pts} ${X(a.length - 1)},160" fill="url(#${id})"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>${a.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${col}"/><text x="${X(i)}" y="182" class="axis">W${i + 1}</text>`).join('')}</svg>`;
}

  const g = [['Ideas', 'ideas', S.ideas.filter(i => m(i.title, i.notes, i.category, i.platform)), i => i.title, i => `${i.platform} · ${i.type}`, 'edit'], ['Projects', 'projects', S.projects.filter(p => m(p.name, p.desc)), p => p.name, p => p.desc, 'edit'], ['Scripts', 'scripts', S.scripts.filter(s => m(s.title, s.hook, s.body)), s => s.title, s => s.platform, 'edit'], ['Templates', 'templates', S.templates.filter(t => m(t.name, t.hook)), t => t.name, t => t.hook, 'usetpl']];
  const n = g.reduce((a, x) => a + x[2].length, 0);
  return head('Search', `${n} result${n === 1 ? '' : 's'} for “${esc(ui.gq)}”`) + (g.map(([l, c, L, t, s, a]) => L.length ? `<h3 class="grp">${l}</h3>${L.map(x => `<button class="res" data-act="${a}" data-c="${c}" data-id="${x.id}"><b>${esc(t(x))}</b><span class="mut">${esc(s(x))}</span></button>`).join('')}` : '').join('') || empty('Nothing found. Try another keyword.'));
};

/* render */
function render() {
  document.documentElement.dataset.theme = S.theme;
  const nav = NAV.map(([k, l, s]) => `<button class="nv${ui.view === k && !ui.gq ? ' on' : ''}" data-act="nav" data-v="${k}">${ic(k)}<span>${ui.mobile ? s : l}</span></button>`);
  $('#nav').innerHTML = nav.join('');
  $('#tabbar').innerHTML = NAV.map(([k, l, s]) => `<button class="nv${ui.view === k && !ui.gq ? ' on' : ''}" data-act="nav" data-v="${k}">${ic(k, 22)}<span>${s}</span></button>`).join('');
  $('#si').innerHTML = ic('search', 18);
  $('#theme').innerHTML = ic(S.theme === 'dark' ? 'sun' : 'moon');
  $('#view').innerHTML = ui.gq.trim() ? V.search() : V[ui.view]();
}

/* actions */
const mk = () => { if (!ui.cap.topic.trim()) return toast('Enter a topic first'), false; ui.cap.out = make(); render(); };
const A = {
  nav: (c, i, v) => { ui.view = v; ui.gq = ''; $('#gs').value = ''; render(); scrollTo(0, 0); },
  add: c => openForm(c), edit: (c, i) => openForm(c, i), addcal: (c, i, v) => openForm('calendar', null, { date: v }), close,
  del: (c, i) => { if (confirm('Delete this item?')) { S[c] = S[c].filter(x => x.id !== i); save(); render(); } },
  theme: (c, i, v) => { S.theme = v || (S.theme === 'dark' ? 'light' : 'dark'); save(); render(); },
  quick: () => modal(`<h3>Quick Add</h3><div class="grid2">${[['ideas', '💡 Idea'], ['calendar', '📅 Scheduled content'], ['scripts', '📝 Script'], ['projects', '📁 Project'], ['tasks', '✅ Task']].map(([c, l]) => `<button class="btn ghost" data-act="add" data-c="${c}">${l}</button>`).join('')}</div>`),
  tidea: (c, i) => { const x = S.ideas.find(y => y.id === i); x.status = x.status === 'Completed' ? 'Idea' : 'Completed'; save(); render(); },
  ttask: (c, i) => { const x = S.tasks.find(y => y.id === i); x.done = !x.done; save(); render(); },
  prog: (c, i, v) => { const p = S.projects.find(y => y.id === i); p.done = Math.min(p.total, Math.max(0, p.done + +v)); save(); render(); },
  cal: (c, i, v) => { const m = ui.month; ui.month = v === '0' ? new Date() : new Date(m.getFullYear(), m.getMonth() + +v, 1); render(); },
  usetpl: (c, i) => { const t = S.templates.find(y => y.id === i); openForm('scripts', null, { title: t.name, hook: t.hook, body: t.structure.map((s, n) => `${n + 1}. ${s}`).join('\n'), cta: t.cta }); },
  copyscript: (c, i) => { const s = S.scripts.find(y => y.id === i); copy(`${s.title}\n\nHOOK:\n${s.hook}\n\nSCRIPT:\n${s.body}\n\nCTA:\n${s.cta}`); },
  gen: () => { ui.cap.n = 0; mk(); }, regen: () => { ui.cap.n++; mk(); }, copycap: () => copy(ui.cap.out),
  afilter: (c, i, v) => { ui.ap = v; render(); },
  export: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = 'creatorhub-data.json'; a.click(); },
  reset: () => { if (confirm('Reset everything to the sample data?')) { S = { ...CH.seed(), theme: S.theme }; save(); render(); } }
};
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return close();
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset; (A[d.act] || (() => { }))(d.c, d.id, d.v);
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.f) { ui[d.f] = t.value; $('#list').innerHTML = ideaRows(); }
  else if (d.cap) ui.cap[d.cap] = t.value;
  else if (d.name !== undefined) { S.user.name = t.value; save(); }
  else if (t.id === 'gs') { ui.gq = t.value; render(); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset.chg) return;
  S[t.dataset.chg].find(y => y.id === t.dataset.id).status = t.value; save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

render();
})();
</script>
</body>
</html>
